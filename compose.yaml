services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: studio
      POSTGRES_DB: studio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your environment}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - studio_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studio -d studio"]
      interval: 3s
      timeout: 3s
      retries: 20
  model-worker:
    profiles: [models]
    build:
      context: ./backend
      dockerfile: Dockerfile.model-worker
    environment:
      DATABASE_URL: postgresql+psycopg://studio:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/studio
      MODEL_PROVIDER: mock
      ARS_OPENAI_API_KEY: ${ARS_OPENAI_API_KEY:-}
      ARS_OPENAI_APPROVAL: ${ARS_OPENAI_APPROVAL:-}
      ARS_OPENAI_PRICE_CONFIRMED: ${ARS_OPENAI_PRICE_CONFIRMED:-}
      ARS_OPENAI_MAX_UNITS: ${ARS_OPENAI_MAX_UNITS:-0}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 180s
    read_only: true
    tmpfs: [/tmp]
volumes:
  studio_postgres:
